name: Build Check Pipeline

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            viewer/package-lock.json
            viewer/client/package-lock.json
            viewer/server/package-lock.json
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: viewer/package-lock.json # Adjust if your lockfile is elsewhere

      - name: Configure environment and run build checks
        run: |
          cd viewer
          cp server/.env.example server/.env
          sed -i 's/<password>/xEWD4vRoNpuatDUe/g' server/.env
          
          # Install dependencies cleanly using ci instead of install
          npm ci
          
          # Run your build/test scripts here instead of 'npm run dev'
          npm run build
          # npm test  # Uncomment if you have test scripts configured
