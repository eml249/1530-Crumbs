name: Build Check Pipeline

on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Configure environment and run build checks
        run: |
          cd viewer
          cp server/.env.example server/.env
          sed -i 's/<password>/xEWD4vRoNpuatDUe/g' server/.env
          npm run setup
                
          # Build the React/Vite frontend (adjust 'client' if your folder is named 'frontend')
          npm --prefix client run build
                
          # Verify the Express backend parses without syntax errors (adjust path if needed)
          node --check server/index.js
